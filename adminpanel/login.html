<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Electronics Portfolio</title>
    <link rel="stylesheet" href="../css/style.css">
    
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <header>
        <h1><a href="../index.html" style="color:inherit; text-decoration:none;">Anti-Gravity Admin</a></h1>
        <nav>
            <a href="../index.html">View Site</a>
        </nav>
    </header>

    <main class="container">
        <section class="admin-container" style="max-width: 400px;">
            <div class="admin-header">
                <h2>Admin Login</h2>
                <p style="color: var(--text-secondary); margin-top: 0.5rem;">Please sign in to manage projects.</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="admin@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>

                <button type="submit" id="login-btn" class="btn">Login</button>
                
                <div class="loader-container" id="login-loader">
                    <span class="loader"></span>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>Developed and Maintained by <span>Nithin</span> &copy; 2026</p>
    </footer>

    <div id="toast" class="toast">Message here</div>

    <script src="../js/supabase-config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
